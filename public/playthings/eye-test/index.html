<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eye test</title>
  <meta name="description" content="One or two? Pick between pairs until a design language falls out.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Source+Serif+4:opsz,wght@8..60,300..700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=IBM+Plex+Sans:wght@300..700&family=IBM+Plex+Mono:wght@400;600&family=EB+Garamond:wght@400..700&family=Work+Sans:wght@300..700&family=Newsreader:opsz,wght@6..72,300..700&family=Fraunces:opsz,wght@9..144,300..700&display=swap" rel="stylesheet">
  <style>
    /* Page chrome is deliberately neutral so it doesn't lean on the answer. */
    :root { color-scheme: light dark; }
    html { background: #8a8a8a; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #111; background: #8a8a8a; }
    .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.6rem 1rem; background: #777; color: #fff; }
    .bar b { font-weight: 600; }
    .bar a { color: #fff; }
    .bar .meta { opacity: 0.85; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; }
    @media (max-width: 52rem) { .pair { grid-template-columns: 1fr; } }
    .side { position: relative; cursor: pointer; border: 3px solid transparent; }
    .side:hover, .side:focus-visible { border-color: #fff; outline: none; }
    .side .num { position: absolute; top: -0.2rem; left: 50%; transform: translate(-50%, -100%); background: #333; color: #fff; font-weight: 700; padding: 0.1rem 0.7rem; border-radius: 2px; }
    .pane { height: 34rem; overflow: hidden; }
    @media (max-width: 52rem) { .pane { height: 22rem; } }
    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; padding: 0 1rem 1.5rem; }
    button.ctl { font: inherit; padding: 0.45rem 0.9rem; background: #444; color: #fff; border: 0; border-radius: 3px; cursor: pointer; }
    button.ctl:hover { background: #222; }
    .hint { text-align: center; color: #eee; padding-bottom: 1.5rem; }
    kbd { background: #555; color: #fff; padding: 0 0.35em; border-radius: 2px; font-family: inherit; }
    .results { max-width: 44rem; margin: 0 auto; padding: 1rem 1rem 3rem; color: #fff; }
    .results h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
    .results table { border-collapse: collapse; width: 100%; }
    .results td { padding: 0.3rem 0.5rem 0.3rem 0; vertical-align: top; border-bottom: 1px solid #999; }
    .results td:first-child { color: #ddd; width: 9rem; }
    .results td:last-child { width: 5rem; text-align: right; }
    .results td button { font: inherit; background: transparent; color: #fff; border: 1px solid #ccc; border-radius: 3px; padding: 0.1rem 0.5rem; cursor: pointer; }
    textarea { width: 100%; height: 14rem; font: 12px/1.4 ui-monospace, monospace; background: #333; color: #eee; border: 0; padding: 0.6rem; }
    .full { padding: 1rem; }
    .full .pane { height: auto; }
    .hidden { display: none; }

    /* The specimen. Everything visual comes from custom properties set per pane. */
    .pane {
      background: var(--paper); color: var(--ink);
      font-family: var(--font); font-size: var(--size); line-height: var(--lh);
      padding: calc(2.2rem * var(--space)) calc(2rem * var(--space));
      text-align: var(--align);
    }
    .pane .inner { max-width: var(--measure); margin: 0 auto; }
    .pane[data-align="left"] .inner { margin: 0; }
    .pane h1, .pane h2, .pane h3, .pane h4 { font-family: var(--hfont); color: var(--ink); margin: 0; line-height: 1.15; }
    .pane h1 { font-size: 2.2em; font-weight: var(--hweight); letter-spacing: var(--htrack); text-transform: var(--hcase); font-variant-caps: var(--hcaps); margin-bottom: calc(0.3em * var(--space)); }
    .pane h2 { font-size: 1.05em; font-weight: var(--hweight); letter-spacing: var(--htrack); text-transform: var(--hcase); font-variant-caps: var(--hcaps); margin: calc(1.6em * var(--space)) 0 calc(0.5em * var(--space)); color: var(--muted); }
    .pane h3 { font-size: 1.1em; font-weight: var(--hweight); margin-bottom: 0.25em; }
    .pane h4 { font-size: 1em; font-weight: var(--hweight); margin-bottom: 0.3em; }
    .pane p { margin: 0 0 calc(0.75em * var(--space)); }
    .pane .sub { color: var(--muted); }
    .pane ul { margin: 0 0 calc(0.75em * var(--space)); padding-left: 1.2em; }
    .pane li { margin-bottom: calc(0.25em * var(--space)); }
    .pane a { color: var(--linkcolor); text-decoration: var(--linkdeco); text-underline-offset: 0.15em; }
    .pane .card { padding: calc(1em * var(--space)); margin: calc(1em * var(--space)) 0; border-radius: var(--radius); background: var(--card-bg); border: var(--card-border); box-shadow: var(--card-shadow); text-align: left; }
    .pane .btns { display: flex; gap: 0.6em; flex-wrap: wrap; justify-content: var(--btn-justify); margin-bottom: calc(1em * var(--space)); }
    .pane button { font: inherit; font-size: 0.95em; padding: 0.5em 1.1em; border-radius: var(--radius); cursor: default;
      background: var(--btn-bg); color: var(--btn-fg); border: var(--btn-border); }
    .pane button.secondary { background: transparent; color: var(--accent-fg); border: 1px solid var(--accent-fg); }
    .pane table { border-collapse: collapse; font-size: 0.92em; width: 100%; text-align: left; }
    .pane th, .pane td { padding: 0.4em 0.6em 0.4em 0; border-bottom: 1px solid var(--rule); }
    .pane th { font-weight: 600; color: var(--muted); }
  </style>
</head>
<body>
  <div class="bar">
    <div><b>Eye test</b> <span class="meta" id="progress"></span></div>
    <div class="meta"><a href="/playthings">playthings</a></div>
  </div>

  <div id="test">
    <div class="pair">
      <div class="side" id="side1" tabindex="0"><span class="num">1</span><div class="pane" id="pane1"></div></div>
      <div class="side" id="side2" tabindex="0"><span class="num">2</span><div class="pane" id="pane2"></div></div>
    </div>
    <p class="hint">One or two? Press <kbd>1</kbd> or <kbd>2</kbd>, <kbd>S</kbd> for no difference, <kbd>Backspace</kbd> to go back.</p>
    <div class="controls">
      <button class="ctl" id="same">No difference</button>
      <button class="ctl" id="back">Back</button>
      <button class="ctl" id="skip">Skip this dimension</button>
      <button class="ctl" id="reset">Start again</button>
    </div>
  </div>

  <div id="done" class="results hidden">
    <h2>Your prescription</h2>
    <p id="prose"></p>
    <table id="table"></table>
    <h2>Preview</h2>
    <div class="full"><div class="pane" id="paneFull"></div></div>
    <h2>Tokens</h2>
    <textarea id="css" readonly></textarea>
    <div class="controls" style="justify-content:flex-start">
      <button class="ctl" id="copy">Copy CSS</button>
      <button class="ctl" id="again">Start again</button>
    </div>
  </div>

<script>
// ---- Dimensions. Order matters: the big decisions first, each later one is judged on top of the earlier winners.
const FONTS = {
  'Inter': '"Inter", system-ui, sans-serif',
  'Source Serif 4': '"Source Serif 4", Georgia, serif',
  'Bricolage Grotesque': '"Bricolage Grotesque", system-ui, sans-serif',
  'IBM Plex Sans': '"IBM Plex Sans", system-ui, sans-serif',
  'EB Garamond': '"EB Garamond", Georgia, serif',
  'Work Sans': '"Work Sans", system-ui, sans-serif',
  'Newsreader': '"Newsreader", Georgia, serif',
  'Fraunces': '"Fraunces", Georgia, serif',
  'IBM Plex Mono': '"IBM Plex Mono", ui-monospace, monospace',
  'System': 'system-ui, -apple-system, "Segoe UI", sans-serif',
};
const PAPERS = {
  'white': { paper: '#ffffff', dark: false },
  'warm white': { paper: '#faf8f3', dark: false },
  'cool white': { paper: '#f5f7f9', dark: false },
  'grey': { paper: '#e9e9e6', dark: false },
  'near black': { paper: '#121212', dark: true },
  'dark warm': { paper: '#1b1917', dark: true },
  'dark cool': { paper: '#171b21', dark: true },
};
const ACCENTS = {
  'none': null, 'blue': [214, 50], 'navy': [214, 35], 'green': [160, 40], 'teal': [190, 45],
  'red': [12, 60], 'orange': [28, 70], 'purple': [270, 45], 'pink': [335, 55],
};

const DIMS = [
  { key: 'font',    label: 'Typeface',        values: Object.keys(FONTS) },
  { key: 'hfont',   label: 'Heading typeface', values: ['same', 'serif if sans, sans if serif', 'mono', 'Bricolage Grotesque', 'Fraunces'] },
  { key: 'size',    label: 'Base size',       values: [16, 18, 17, 15, 19, 20] },
  { key: 'lh',      label: 'Line height',     values: [1.5, 1.65, 1.4, 1.75, 1.3] },
  { key: 'measure', label: 'Line length',     values: ['60ch', '72ch', '50ch', '85ch', '42ch'] },
  { key: 'paper',   label: 'Background',      values: Object.keys(PAPERS) },
  { key: 'contrast',label: 'Text contrast',   values: ['high', 'soft', 'softer'] },
  { key: 'tint',    label: 'Text tint',       values: ['neutral', 'warm', 'cool'] },
  { key: 'accent',  label: 'Accent colour',   values: Object.keys(ACCENTS) },
  { key: 'link',    label: 'Links',           values: ['underline', 'colour only', 'underline, ink colour', 'underline, thin'] },
  { key: 'heading', label: 'Headings',        values: ['bold', 'semibold', 'light', 'small caps', 'uppercase tracked', 'medium tight'] },
  { key: 'align',   label: 'Header alignment', values: ['left', 'centered'] },
  { key: 'space',   label: 'Spacing',         values: [1, 0.8, 1.25, 1.5, 0.65] },
  { key: 'radius',  label: 'Corners',         values: ['4px', '0', '8px', '14px', '2px', '999px'] },
  { key: 'surface', label: 'Cards',           values: ['hairline', 'flat fill', 'shadow', 'none', 'hairline + fill'] },
  { key: 'button',  label: 'Buttons',         values: ['filled accent', 'filled ink', 'outline', 'text only'] },
];

// ---- Turn a choice object into CSS custom properties.
function hsl(h, s, l) { return `hsl(${h} ${s}% ${l}%)`; }
function tokens(c) {
  const P = PAPERS[c.paper]; const dark = P.dark;
  const tintH = c.tint === 'warm' ? 30 : c.tint === 'cool' ? 215 : 0;
  const tintS = c.tint === 'neutral' ? 0 : 12;
  const inkL = dark ? { high: 92, soft: 84, softer: 76 }[c.contrast] : { high: 8, soft: 16, softer: 24 }[c.contrast];
  const ink = hsl(tintH, tintS, inkL);
  const muted = hsl(tintH, tintS, dark ? inkL - 30 : inkL + 36);
  const rule = hsl(tintH, tintS, dark ? 24 : 84);
  const A = ACCENTS[c.accent];
  const accent = A ? hsl(A[0], A[1], dark ? 68 : 36) : ink;
  const hasAccent = Boolean(A);
  const font = FONTS[c.font];
  const isSerif = /serif|Garamond|Newsreader|Fraunces/i.test(c.font) && !/sans/i.test(c.font);
  let hfont = font;
  if (c.hfont === 'serif if sans, sans if serif') hfont = isSerif ? FONTS['Inter'] : FONTS['Source Serif 4'];
  else if (c.hfont === 'mono') hfont = FONTS['IBM Plex Mono'];
  else if (c.hfont !== 'same') hfont = FONTS[c.hfont];
  const H = {
    'bold': ['700', '0', 'none', 'normal'], 'semibold': ['600', '0', 'none', 'normal'], 'light': ['300', '-0.01em', 'none', 'normal'],
    'small caps': ['500', '0.06em', 'none', 'all-small-caps'], 'uppercase tracked': ['600', '0.12em', 'uppercase', 'normal'], 'medium tight': ['500', '-0.02em', 'none', 'normal'],
  }[c.heading];
  const link = {
    'underline': [accent, 'underline'], 'colour only': [accent, 'none'], 'underline, ink colour': [ink, 'underline'], 'underline, thin': [accent, 'underline 1px'],
  }[c.link];
  const cardBg = dark ? hsl(tintH, tintS, 14) : hsl(tintH, tintS, 97);
  const surface = {
    'hairline': [ 'transparent', `1px solid ${rule}`, 'none' ],
    'flat fill': [ cardBg, 'none', 'none' ],
    'shadow': [ dark ? cardBg : '#fff', 'none', dark ? '0 2px 12px rgba(0,0,0,.5)' : '0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.06)' ],
    'none': [ 'transparent', 'none', 'none' ],
    'hairline + fill': [ cardBg, `1px solid ${rule}`, 'none' ],
  }[c.surface];
  const btn = {
    'filled accent': [accent, dark ? '#111' : '#fff', 'none'],
    'filled ink': [ink, P.paper, 'none'],
    'outline': ['transparent', accent, `1px solid ${accent}`],
    'text only': ['transparent', accent, '1px solid transparent'],
  }[c.button];
  return {
    '--font': font, '--hfont': hfont, '--size': c.size + 'px', '--lh': c.lh, '--measure': c.measure,
    '--paper': P.paper, '--ink': ink, '--muted': muted, '--rule': rule, '--accent-fg': accent,
    '--linkcolor': link[0], '--linkdeco': link[1],
    '--hweight': H[0], '--htrack': H[1], '--hcase': H[2], '--hcaps': H[3],
    '--align': c.align === 'centered' ? 'center' : 'left', '--btn-justify': c.align === 'centered' ? 'center' : 'flex-start',
    '--space': c.space, '--radius': c.radius,
    '--card-bg': surface[0], '--card-border': surface[1], '--card-shadow': surface[2],
    '--btn-bg': btn[0], '--btn-fg': btn[1], '--btn-border': btn[2],
    _hasAccent: hasAccent,
  };
}

const SPECIMEN = `
  <div class="inner">
    <h1>Matthew Cree</h1>
    <p class="sub">Senior software engineer, Dromara, Northern Ireland.</p>
    <div class="btns"><button>Email</button><button class="secondary">Download PDF</button></div>
    <h2>Experience</h2>
    <h3>Gearset, 2022 to present</h3>
    <p>Salesforce DevOps platform. Full stack. Found two bugs in git while working on the semantic merge driver and <a href="#">reported both on the mailing list</a>.</p>
    <ul><li>Handle customer issues escalated past support.</li><li>Mentor newer engineers.</li></ul>
    <div class="card"><h4>Observability</h4><p>Lead engineer. Monitors Salesforce Flow failures and unhandled Apex exceptions. Charts trends, alerts on thresholds.</p></div>
    <table><tr><th>Year</th><th>Role</th><th>Place</th></tr><tr><td>2022</td><td>Senior Software Engineer</td><td>Belfast</td></tr><tr><td>2021</td><td>Polyglot Software Engineer</td><td>Remote</td></tr></table>
  </div>`;

function paint(pane, choice) {
  const t = tokens(choice);
  for (const [k, v] of Object.entries(t)) if (k.startsWith('--')) pane.style.setProperty(k, v);
  pane.dataset.align = choice.align;
  pane.innerHTML = SPECIMEN;
}

// ---- The test itself.
const KEY = 'eye-test-v1';
let state;
function fresh() {
  const choice = {}; for (const d of DIMS) choice[d.key] = d.values[0];
  return { choice, dim: 0, cand: 1, flip: Math.random() < 0.5, history: [] };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.choice) return s; } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function current() { return state.choice; }
function candidate() {
  const d = DIMS[state.dim];
  return { ...state.choice, [d.key]: d.values[state.cand] };
}

function render() {
  const test = document.getElementById('test'), done = document.getElementById('done');
  if (state.dim >= DIMS.length) { test.classList.add('hidden'); done.classList.remove('hidden'); renderDone(); return; }
  test.classList.remove('hidden'); done.classList.add('hidden');
  const d = DIMS[state.dim];
  const a = current(), b = candidate();
  paint(document.getElementById('pane1'), state.flip ? b : a);
  paint(document.getElementById('pane2'), state.flip ? a : b);
  const total = DIMS.reduce((n, x) => n + x.values.length - 1, 0);
  const doneCount = DIMS.slice(0, state.dim).reduce((n, x) => n + x.values.length - 1, 0) + state.cand - 1;
  document.getElementById('progress').textContent = `${d.label}, ${state.cand} of ${d.values.length - 1}. ${doneCount + 1} of ${total} overall.`;
  save();
}

function advance() {
  state.cand += 1;
  if (state.cand >= DIMS[state.dim].values.length) { state.dim += 1; state.cand = 1; }
  state.flip = Math.random() < 0.5;
}
function pick(side) { // 1 or 2 or 'same'
  if (state.dim >= DIMS.length) return;
  state.history.push(JSON.stringify({ choice: state.choice, dim: state.dim, cand: state.cand, flip: state.flip }));
  if (side !== 'same') {
    const choseCandidate = (side === 1) === state.flip;
    if (choseCandidate) state.choice = candidate();
  }
  advance(); render();
}
function back() {
  const h = state.history.pop(); if (!h) return;
  Object.assign(state, JSON.parse(h)); render();
}
function skip() {
  if (state.dim >= DIMS.length) return;
  state.history.push(JSON.stringify({ choice: state.choice, dim: state.dim, cand: state.cand, flip: state.flip }));
  state.dim += 1; state.cand = 1; render();
}
function retest(i) { state.dim = i; state.cand = 1; state.history = []; render(); }

function prose(c) {
  const t = tokens(c);
  return `${c.font} at ${c.size}px, line height ${c.lh}, ${c.measure} lines. ` +
    `${c.hfont === 'same' ? 'Headings in the same face' : 'Headings in ' + c.hfont}, ${c.heading}, ${c.align}. ` +
    `${c.paper[0].toUpperCase() + c.paper.slice(1)} background, ${c.contrast} contrast, ${c.tint} tint, ${t._hasAccent ? c.accent + ' accent' : 'no accent colour'}. ` +
    `Links ${c.link}. Spacing ${c.space}×. Corners ${c.radius}. Cards: ${c.surface}. Buttons: ${c.button}.`;
}
function cssOut(c) {
  const t = tokens(c);
  const lines = Object.entries(t).filter(([k]) => k.startsWith('--')).map(([k, v]) => `  ${k}: ${v};`);
  return `/* Eye test result, ${new Date().toISOString().slice(0, 10)} */\n:root {\n${lines.join('\n')}\n}\n\n/* choices: ${JSON.stringify(c)} */\n`;
}
function renderDone() {
  const c = state.choice;
  document.getElementById('prose').textContent = prose(c);
  document.getElementById('table').innerHTML = DIMS.map((d, i) =>
    `<tr><td>${d.label}</td><td>${c[d.key]}</td><td><button data-i="${i}">Retest from here</button></td></tr>`).join('');
  document.getElementById('css').value = cssOut(c);
  paint(document.getElementById('paneFull'), c);
  save();
}

document.getElementById('side1').addEventListener('click', () => pick(1));
document.getElementById('side2').addEventListener('click', () => pick(2));
document.getElementById('same').addEventListener('click', () => pick('same'));
document.getElementById('back').addEventListener('click', back);
document.getElementById('skip').addEventListener('click', skip);
document.getElementById('reset').addEventListener('click', () => { state = fresh(); render(); });
document.getElementById('again').addEventListener('click', () => { state = fresh(); render(); });
document.getElementById('table').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) retest(Number(b.dataset.i)); });
document.getElementById('copy').addEventListener('click', () => { navigator.clipboard?.writeText(document.getElementById('css').value); });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === '1') pick(1); else if (e.key === '2') pick(2);
  else if (e.key === 's' || e.key === 'S') pick('same');
  else if (e.key === 'Backspace') { e.preventDefault(); back(); }
});

state = load(); render();
</script>
</body>
</html>
